<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Operation System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">✈️ Flight Operation System</div>
            <button class="login-btn" onclick="window.location.href='login.html'">Login</button>
        </div>
    </nav>

    <main class="main-content">
        <section class="hero">
            <h1>Welcome to Flight Operation System</h1>
            <p>Book your next journey with ease</p>
        </section>

        <section class="search-section">
            <div class="search-container">
                <h2>Search Flights</h2>
                <form id="searchForm" class="search-form">
                    <div class="form-group">
                        <label>From</label>
                        <input type="text" id="origin" placeholder="Origin Airport Code" required>
                    </div>
                    <div class="form-group">
                        <label>To</label>
                        <input type="text" id="destination" placeholder="Destination Airport Code" required>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <button type="submit" class="search-btn">Search Flights</button>
                </form>
            </div>
        </section>

        <section class="results-section" id="resultsSection" style="display: none;">
            <div class="results-container">
                <h2>Available Flights</h2>
                <div id="flightResults"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
