<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>✈️ Flight Operation System</h1>
      <h2>Login</h2>
    </div>
    
    <form (ngSubmit)="login()" class="auth-form">
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
      
      <div class="form-group">
        <label>Email</label>
        <input 
          type="email" 
          [(ngModel)]="loginData.email" 
          name="email" 
          placeholder="Enter your email"
          (blur)="validateField('email')"
          [class.error]="fieldErrors.email"
          required>
        <span class="field-error" *ngIf="fieldErrors.email">{{ fieldErrors.email }}</span>
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <div class="password-input">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            [(ngModel)]="loginData.password" 
            name="password" 
            placeholder="Enter your password"
            (blur)="validateField('password')"
            [class.error]="fieldErrors.password"
            required>
          <button 
            type="button" 
            class="toggle-password" 
            (click)="togglePasswordVisibility()">
            {{ showPassword ? '👁️' : '👁️🗨️' }}
          </button>
        </div>
        <span class="field-error" *ngIf="fieldErrors.password">{{ fieldErrors.password }}</span>
      </div>
      
      <button type="submit" class="submit-btn" [disabled]="isLoading">
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>
      
      <div class="auth-footer">
        <p>Don't have an account? <a (click)="goToRegister()">Register here</a></p>
      </div>
    </form>
  </div>
</div>
